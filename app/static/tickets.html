<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fc">
  <title>工单中心 · IT 服务台</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#17223b;background:#f6f7fb;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:flex;min-height:100vh}.side{width:226px;background:#111a2e;color:#aeb9d0;padding:24px 15px;flex-shrink:0}.brand{display:flex;gap:11px;align-items:center;color:white;font-size:16px;font-weight:700;padding:2px 10px 32px}.brand-mark{width:34px;height:34px;border-radius:11px;background:#635bff;color:#fff;display:grid;place-items:center;font-size:18px}.nav-label{font-size:10px;letter-spacing:1.5px;color:#687795;margin:10px 11px}.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:9px;margin:4px 0;font-size:13px}.nav.active{background:#242f4a;color:white}.nav .ico{width:18px;text-align:center}.side-foot{position:absolute;bottom:21px;font-size:11px;line-height:1.7;padding:0 10px;color:#75829b}.main{flex:1;min-width:0}.topbar{height:68px;background:#fff;border-bottom:1px solid #e9ecf3;display:flex;justify-content:space-between;align-items:center;padding:0 34px}.crumb{font-size:12px;color:#8b93a7}.profile{display:flex;align-items:center;gap:10px;font-size:12px;color:#58647c}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#e9e8ff;color:#5d55e8;font-weight:700}.content{max-width:1280px;padding:31px 36px 50px;margin:auto}.heading{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px}.eyebrow{font-size:11px;color:#7d86a0;letter-spacing:1.1px;margin-bottom:8px}.heading h1{font-size:26px;letter-spacing:-.5px;margin:0 0 7px}.subtitle{font-size:12px;color:#8a92a5}.primary{border:0;color:white;background:#615cf4;padding:11px 17px;border-radius:8px;font-weight:600;font-size:12px;box-shadow:0 4px 10px #625cf42a}.primary:hover{background:#514be1}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.card,.panel{background:white;border:1px solid #eceef4;border-radius:12px;box-shadow:0 3px 12px #23305208}.card{padding:18px}.card-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#7f8799}.card-icon{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#eeedff;color:#635bff}.card-value{font-size:27px;font-weight:700;margin:10px 0 4px;letter-spacing:-.7px}.card-note{font-size:10px;color:#a0a6b5}.card.warn .card-icon{background:#fff2e7;color:#f2994a}.card.danger .card-icon{background:#fff0f0;color:#e26868}.panel{overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;padding:19px 20px 15px}.panel-title{font-weight:700;font-size:14px}.panel-desc{font-size:10px;color:#9ba2b2;margin-top:5px}.filters{display:flex;gap:8px}.filters select,.filters input{height:34px;border:1px solid #e7e9f0;border-radius:7px;color:#667087;background:white;padding:0 10px;font-size:11px;outline:none}.filters input{width:190px}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:730px}th{text-align:left;background:#fafbfe;color:#8991a4;font-weight:500;font-size:10px;padding:11px 20px;border-top:1px solid #f0f1f5}td{font-size:11px;padding:14px 20px;border-top:1px solid #f1f2f6;color:#58647a}tbody tr:hover{background:#fcfcff}.ticket-id{color:#7b78ed;font-weight:700}.ticket-title{font-weight:600;color:#222d44;font-size:12px}.minor{font-size:10px;color:#9ba2b2;margin-top:4px}.pill{display:inline-flex;border-radius:20px;padding:5px 9px;font-size:9px;font-weight:600;background:#f1f2f6;color:#727c90}.pill.open{background:#fff4e6;color:#d68a26}.pill.assigned{background:#edf2ff;color:#6275ce}.pill.progress{background:#e9f6ff;color:#3982b5}.pill.resolved{background:#eaf8f0;color:#39936a}.pill.closed{background:#f0f1f5;color:#7d8596}.priority{display:flex;align-items:center;gap:5px}.dot{width:6px;height:6px;border-radius:50%;background:#9ca3b3}.dot.high{background:#e56a6a}.dot.medium{background:#e5aa49}.dot.low{background:#5caf87}.empty{text-align:center;color:#9ba2b2;padding:46px!important}.toast{position:fixed;right:24px;bottom:24px;padding:12px 17px;background:#19233a;color:white;border-radius:9px;font-size:12px;box-shadow:0 8px 25px #17223b33;display:none;z-index:10}.toast.show{display:block}.modal-backdrop{position:fixed;inset:0;background:#10182b70;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal-backdrop.show{display:flex}.modal{background:white;border-radius:14px;width:min(540px,100%);padding:23px;box-shadow:0 20px 60px #17223b30}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal-head h2{font-size:17px;margin:0}.close{border:0;background:#f3f4f8;border-radius:7px;width:30px;height:30px;color:#727c90}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:10px;color:#737c8f}.field input,.field select,.field textarea{border:1px solid #e5e8ef;border-radius:7px;padding:10px 11px;font-size:11px;outline:none;color:#263149;background:white}.field textarea{min-height:75px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#817cff;box-shadow:0 0 0 3px #635bff16}.requester-toggle{font-size:10px;color:#615cf4;cursor:pointer;align-self:flex-start}.requester-fields{grid-column:1/-1;display:none;grid-template-columns:1fr 1fr;gap:12px;padding:13px;background:#f8f8ff;border-radius:8px}.requester-fields.show{display:grid}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:19px}.secondary{border:1px solid #e4e7ef;background:#fff;padding:10px 15px;border-radius:8px;font-size:11px;color:#687187}.loading{color:#a0a6b5}.refresh{border:0;background:transparent;color:#787f90;font-size:11px}@media(max-width:900px){.side{width:65px;padding:20px 10px}.brand{padding:2px 5px 32px}.brand-name,.nav-label,.nav span:not(.ico),.side-foot{display:none}.nav{justify-content:center;padding:12px 5px}.content{padding:25px 20px}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.side{display:none}.topbar{padding:0 18px}.content{padding:22px 14px}.heading{align-items:flex-start;gap:15px}.heading h1{font-size:22px}.primary{padding:10px 12px;white-space:nowrap}.cards{gap:9px}.card{padding:14px}.card-value{font-size:23px}.panel-head{align-items:flex-start;gap:12px;flex-direction:column}.filters{width:100%;flex-wrap:wrap}.filters input{flex:1;width:120px}.form-grid{grid-template-columns:1fr}.field.full,.requester-fields{grid-column:auto}.requester-fields{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><div class="brand-mark">✦</div><span class="brand-name">IT 服务台</span></div>
    <div class="nav-label">工作空间</div>
    <div class="nav active"><span class="ico">▦</span><span>运营总览</span></div>
    <div class="nav"><span class="ico">▤</span><span>服务工单</span></div>
    <div class="nav-label" style="margin-top:28px">管理</div>
    <div class="nav"><span class="ico">♙</span><span>服务团队</span></div>
    <div class="side-foot">IT SERVICE DESK<br>让每个问题都有回应</div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="crumb">服务管理　/　运营总览</div><div class="profile"><span class="avatar">IT</span><span>服务台管理员</span></div></header>
    <section class="content">
      <div class="heading"><div><div class="eyebrow">SERVICE OPERATIONS</div><h1>工单运营总览</h1><div class="subtitle">追踪服务请求，及时发现并处理积压问题。</div></div><button class="primary" id="open-modal">＋ 新建工单</button></div>
      <div class="cards">
        <div class="card"><div class="card-head">待处理工单 <span class="card-icon">▤</span></div><div class="card-value" id="metric-backlog">—</div><div class="card-note">OPEN、ASSIGNED、IN_PROGRESS</div></div>
        <div class="card warn"><div class="card-head">待分配 <span class="card-icon">♙</span></div><div class="card-value" id="metric-unassigned">—</div><div class="card-note">需要分派给服务工程师</div></div>
        <div class="card danger"><div class="card-head">高优先级待处理 <span class="card-icon">⚑</span></div><div class="card-value" id="metric-high">—</div><div class="card-note">优先跟进，避免影响扩大</div></div>
        <div class="card"><div class="card-head">超 24 小时未结 <span class="card-icon">◷</span></div><div class="card-value" id="metric-aging">—</div><div class="card-note">按工单创建时间统计</div></div>
      </div>
      <section class="panel">
        <div class="panel-head"><div><div class="panel-title">服务工单</div><div class="panel-desc" id="ticket-count">正在加载工单…</div></div><div class="filters"><input id="search" placeholder="搜索标题或工单编号"><select id="status-filter"><option value="">全部状态</option><option>OPEN</option><option>ASSIGNED</option><option>IN_PROGRESS</option><option>RESOLVED</option><option>CLOSED</option></select><select id="priority-filter"><option value="">全部优先级</option><option>HIGH</option><option>MEDIUM</option><option>LOW</option></select><button class="refresh" id="refresh">↻ 刷新</button></div></div>
        <div class="table-wrap"><table><thead><tr><th>工单</th><th>类别</th><th>优先级</th><th>状态</th><th>负责人</th><th>创建时间</th></tr></thead><tbody id="tickets"><tr><td colspan="6" class="empty">正在加载…</td></tr></tbody></table></div>
      </section>
    </section>
  </main>
</div>
<div class="modal-backdrop" id="modal"><form class="modal" id="ticket-form"><div class="modal-head"><h2>创建服务工单</h2><button type="button" class="close" id="close-modal">×</button></div><div class="form-grid">
  <div class="field full"><label>问题标题</label><input name="title" required maxlength="200" placeholder="例如：无法连接公司 Wi-Fi"></div>
  <div class="field full"><label>问题描述</label><textarea name="description" required maxlength="1000" placeholder="请描述遇到的问题和影响范围"></textarea></div>
  <div class="field"><label>问题类别</label><select name="category"><option>Hardware</option><option>Software</option><option>Network</option><option>Access</option><option>Other</option></select></div>
  <div class="field"><label>优先级</label><select name="priority"><option>MEDIUM</option><option>HIGH</option><option>LOW</option></select></div>
  <div class="field"><label>申请人</label><select name="employee_id" id="employee-select"></select></div>
  <div class="field"><label>指派工程师（可选）</label><select name="engineer_id" id="engineer-select"><option value="">暂不指派</option></select></div>
  <span class="requester-toggle" id="requester-toggle">＋ 新增申请人</span>
  <div class="requester-fields" id="requester-fields"><div class="field"><label>申请人姓名</label><input id="requester-name" placeholder="姓名"></div><div class="field"><label>部门</label><input id="requester-department" placeholder="例如：市场部"></div><div class="field full"><label>邮箱</label><input id="requester-email" type="email" placeholder="name@company.com"></div></div>
  </div><div class="form-actions"><button type="button" class="secondary" id="cancel-modal">取消</button><button class="primary" type="submit" id="submit-ticket">创建工单</button></div></form></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);let allTickets=[];
async function api(url,options){const r=await fetch(url,options);const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.detail||'请求失败');return data}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2800)}
function statusClass(s){return {OPEN:'open',ASSIGNED:'assigned',IN_PROGRESS:'progress',RESOLVED:'resolved',CLOSED:'closed'}[s]||''}
function statusName(s){return {OPEN:'待处理',ASSIGNED:'已分配',IN_PROGRESS:'处理中',RESOLVED:'已解决',CLOSED:'已关闭'}[s]||s}
function priorityName(s){return {HIGH:'高',MEDIUM:'中',LOW:'低'}[s]||s}
function fmtDate(s){return s?new Date(s).toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit',year:'numeric'}):'—'}
async function load(){try{const [metrics,tickets,employees,engineers]=await Promise.all([api('/analytics/overview'),api('/tickets/'),api('/employees/'),api('/engineers/')]);$('#metric-backlog').textContent=metrics.open_backlog;$('#metric-unassigned').textContent=metrics.unassigned_backlog;$('#metric-high').textContent=metrics.high_priority_backlog;$('#metric-aging').textContent=metrics.aging_backlog_over_24h;allTickets=tickets;renderTickets();const es=$('#employee-select');const old=es.value;es.innerHTML=employees.map(e=>`<option value="${e.id}">${escapeHtml(e.name)} · ${escapeHtml(e.department)}</option>`).join('')||'<option value="">请先新增申请人</option>';if(old)es.value=old;$('#engineer-select').innerHTML='<option value="">暂不指派</option>'+engineers.map(e=>`<option value="${e.id}">${escapeHtml(e.name)} · ${escapeHtml(e.specialization)}</option>`).join('')}catch(e){toast('加载失败：'+e.message);$('#tickets').innerHTML='<tr><td colspan="6" class="empty">无法加载数据，请确认后端服务已启动。</td></tr>'}}
function escapeHtml(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderTickets(){const q=$('#search').value.trim().toLowerCase(),s=$('#status-filter').value,p=$('#priority-filter').value;const rows=allTickets.filter(t=>(!s||t.status===s)&&(!p||t.priority===p)&&(!q||String(t.id).includes(q)||t.title.toLowerCase().includes(q))).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));$('#ticket-count').textContent=`共 ${rows.length} 条工单`;$('#tickets').innerHTML=rows.length?rows.map(t=>`<tr><td><div class="ticket-title">${escapeHtml(t.title)}</div><div class="minor"><span class="ticket-id">#TK-${String(t.id).padStart(4,'0')}</span> · ${escapeHtml(t.description.slice(0,38))}${t.description.length>38?'…':''}</div></td><td>${escapeHtml(t.category)}</td><td><span class="priority"><i class="dot ${t.priority.toLowerCase()}"></i>${priorityName(t.priority)}</span></td><td><span class="pill ${statusClass(t.status)}">${statusName(t.status)}</span></td><td>${t.engineer_id?`工程师 #${t.engineer_id}`:'<span class="minor">待分配</span>'}</td><td>${fmtDate(t.created_at)}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">还没有符合条件的工单，点击右上角创建第一张工单。</td></tr>'}
function openModal(){ $('#modal').classList.add('show') }function closeModal(){ $('#modal').classList.remove('show') }
$('#open-modal').onclick=openModal;$('#close-modal').onclick=closeModal;$('#cancel-modal').onclick=closeModal;$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};$('#refresh').onclick=load;$('#search').oninput=renderTickets;$('#status-filter').onchange=renderTickets;$('#priority-filter').onchange=renderTickets;$('#requester-toggle').onclick=()=>$('#requester-fields').classList.toggle('show');
$('#ticket-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const submit=$('#submit-ticket');submit.disabled=true;submit.textContent='提交中…';try{let employeeId=f.get('employee_id');if(!employeeId){const name=$('#requester-name').value.trim(),email=$('#requester-email').value.trim(),department=$('#requester-department').value.trim();if(!name||!email||!department)throw new Error('请填写申请人信息');const employee=await api('/employees/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,department})});employeeId=employee.id}await api('/tickets/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({employee_id:Number(employeeId),engineer_id:f.get('engineer_id')?Number(f.get('engineer_id')):null,title:f.get('title'),description:f.get('description'),category:f.get('category'),priority:f.get('priority')})});closeModal();e.currentTarget.reset();$('#requester-fields').classList.remove('show');toast('工单创建成功');await load()}catch(err){toast(err.message)}finally{submit.disabled=false;submit.textContent='创建工单'}};
load();
</script>
</body>
</html>
